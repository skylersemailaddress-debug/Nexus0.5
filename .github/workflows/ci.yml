name: CI

on:
  push:
    branches: ["workspace/**", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: apps/shell
        run: npm install

      - name: Build
        working-directory: apps/shell
        run: npm run build

      - name: Lint (optional)
        working-directory: apps/shell
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script, skipping"
          fi
